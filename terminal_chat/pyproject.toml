[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-chat-portfolio"
version = "1.0.0"
description = "Cross-platform secure terminal chat with authenticated sessions and optional TLS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7.0"
]
authors = [
  { name = "Portfolio Candidate" }
]
keywords = ["chat", "terminal", "security", "portfolio", "asyncio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Security"
]

[project.scripts]
securechat-server = "chat_app.server:main"
securechat-client = "chat_app.client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chat_app*"]
